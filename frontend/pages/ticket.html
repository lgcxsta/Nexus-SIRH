<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <!-- <link rel="stylesheet" href="../style/dashboard.css"> -->
    <script src="../script/script.js"></script>
    <link rel="stylesheet" href="../style/forms.css">
    <title>Ticket</title>
</head>

<body>

    <div id="navbar"></div>

    <main style="margin-left: 250px; padding: 20px;">
        <div class="formCard">
            <h1>Formulaire</h1>

            <form>
                <div class="formGroup">
                    <label for="department">Département</label>
                    <select id="department" name="department" class="inputForm" required>
                        <option value="" selected disabled>Sélectionner un département</option>
                        <option value="adminForm">Administration</option>
                        <option value="itForm">Logiciel / IT</option>
                    </select>
                </div>
                <div class="formGroup">
                    <label for="titleForm">Titre</label>
                    <input type="text" class="inputForm" id="titleForm" placeholder="Sujet..." maxlength="100" required>
                </div>

                <div class="formGroup">
                    <label for="formDescription">Description</label>
                    <textarea class="inputForm" id="formDescription" placeholder="Description de votre demande..."
                        maxlength="1500" rows="7"></textarea>
                </div>

                <input type="submit" value="Envoyer">
            </form>
        </div>
    </main>
</body>

</html>
