<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <script src="../script/script.js"></script>
    <link rel="stylesheet" href="../style/toggleTheme.css">
    <link rel="stylesheet" href="../style/forms.css">

    <title>Connexion</title>
</head>

<body>
    <div class="themeBtnDiv" id="btnToggleTheme">
        <label class="switch">
            <input type="checkbox" id="themeToggle" onchange="toggleTheme()" />
            <span class="btnTheme"></span>
            <img class="lightThemeSymbol" src="../img/sun.png">
            <img class="darkThemeSymbol" src="../img/moon.png">
        </label>
    </div>

    <div class="loginCard">
        <h1>Connexion</h1>
        <form>
            <div class="formGroup">
                <label for="formEmail">Email</label>
                <input type="email" class="inputForm" id="formEmail" placeholder="nom@exemple.com" maxlength="25"
                    required>
            </div>

            <div class="formGroup">
                <label for="formPwd">Mot de passe</label>
                <input type="password" class="inputForm" id="formPwd" placeholder="••••••••" maxlength="20" required>
            </div>

            <input type="submit" value="Se connecter">
        </form>
    </div>
</body>

</html>
