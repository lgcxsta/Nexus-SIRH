<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
    <title>Connexion</title>
</head>

<body>

    <div class="loginCard">
        <h1>Connexion</h1>
        <form>
            <div class="formGroup">
                <label for="formEmail">Email</label>
                <input type="email" class="inputForm" id="formEmail" placeholder="nom@exemple.com" maxlength="25"
                    required>
            </div>

            <div class="form-group">
                <label for="formPwd">Mot de passe</label>
                <input type="password" class="inputForm" id="formPwd" placeholder="••••••••" maxlength="20" required>
            </div>

            <input type="submit" value="Se connecter">
        </form>
    </div>

</body>

</html>
